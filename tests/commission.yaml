# The commissioning contract of keel-postgresql (handbook decision 0075).
# bin/keel-commission of Keel-Linux/.github reads it: it makes a container
# from the template as an operator does, answers the first boot (or
# preseeds it with the instance below), and proves each password by a
# login with it. A new first boot question or secret is a change of this
# file in the same pull request.
contract: 1
appliance: postgresql
secrets: [root, db]
# The prompts are the titles that the first boot draws on tty1. A password
# comes first as a menu of the same title (Generate or Manual), and the
# runner takes Manual.
questions:
  - id: root_password
    hook: 30rootpass
    prompt: Root Password
    answer: secret:root
  - id: db_password
    hook: 35pgsqlpass
    prompt: PostgreSQL Password
    answer: secret:db
  - id: alert_email
    hook: 85secalerts
    prompt: System Notifications
    answer: admin@example.org
# keel/instance.example.yaml of this repository, with the secrets of the
# run and no instance name: the machine keeps the name pct create gave it
instance:
  version: 1
  network:
    managed_by: host
    interfaces:
      eth0:
        ipv6:
          method: auto
  tls:
    acme:
      enabled: false
  appliance:
    name: postgresql
  installation:
    mode: simple
  overlays:
    installer: enabled
    wireguard: disabled
    etcd: disabled
    crowdsec: disabled
    vip: disabled
  secrets:
    root_password: secret:root
    db_password: secret:db
  hub:
    api_key: skip
  security:
    alerts: admin@example.org
    updates_at_first_boot: skip
  first_login_wizard: false
proofs:
  - {secret: root, kind: shadow, user: root}
  # a TCP login on each loopback: pg_hba.conf asks a password there
  - {secret: db, kind: pgsql, user: postgres, host: 127.0.0.1, database: postgres}
  - secret: db
    kind: command
    run: PGPASSWORD="$SECRET" psql -h ::1 -U postgres -d postgres -Atc 'SELECT 1' | grep -qx 1
services: [postgresql, webmin, cron, postfix, ssh]
urls:
  - {url: 'https://127.0.0.1:12321/', status: 200}
forbidden:
  # a database layer serves no web page of its own
  - {kind: path, name: /etc/nginx}
  - {kind: hook, name: 40lnpp-check}
# The web pages of the gallery (decision 0077): Webmin before and after the
# login with the root secret, and its PostgreSQL module after it.
screenshots:
  - name: webmin
    port: 12321
    url: /
    login: {user_field: 'input[name=user]', user: root, password_field: 'input[name=pass]', secret: root, submit: 'button[type=submit]'}
    wait: 8
  # the browser keeps the Webmin session of the shot before
  - {name: webmin-postgresql, port: 12321, url: /postgresql/, wait: 8}
# The cloud modes (decision 0076): PostgreSQL is a replicating engine, the
# pair of decisions 0054 and 0057. The prompts are the titles of the
# confconsole screens. This part is declared for the cloud passes; the
# single node passes do not read it.
cloud:
  capture:
    invite: 'keel[12]:[A-Za-z0-9_.~+/=-]+'
    vip: 'VIP:? +([0-9a-f]{1,4}(:[0-9a-f]{0,4}){2,7})'
  checks:
    - {id: vip-holder, at: all, run: 'keel vip status', match: 'holder', count: 1}
    - {id: row-through-vip, at: replica, secret: db, run: 'PGPASSWORD="$SECRET" psql -h "$VIP" -U postgres -d postgres -Atc "SELECT 1"'}
    - {id: promote, at: replica, run: 'keel vip promote'}
    - {id: promoted-holder, at: replica, run: 'keel vip status', match: 'holder'}
    - {id: return, at: primary, run: 'keel vip promote'}
    - {id: returned-holder, at: primary, run: 'keel vip status', match: 'holder'}
nodes:
  - name: primary
    site: br1
    mode: cloud_simple
    role: primary
    answers:
      - {id: mode, prompt: Installation mode, keys: '{down}{ret}'}
      - {id: role, prompt: Role of this node, keys: '{ret}'}
      - {id: invite, prompt: Invite a node, keys: '{ret}'}
  - name: replica
    site: br2
    mode: cloud_simple
    role: replica
    answers:
      - {id: mode, prompt: Installation mode, keys: '{down}{ret}'}
      - {id: role, prompt: Role of this node, keys: '{down}{ret}'}
      - {id: join, prompt: Join a mesh, keys: '{invite:1}{ret}'}
